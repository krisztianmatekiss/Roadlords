name: Build, test and publish Roadlords
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select Chromium for browser tests
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            roadlords_browser_path="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            roadlords_browser_path="$(command -v chromium)"
          else
            npx playwright install --with-deps chromium
            roadlords_browser_path="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          printf 'CHROMIUM_PATH=%s\n' "$roadlords_browser_path" >> "$GITHUB_ENV"
          "$roadlords_browser_path" --version
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
