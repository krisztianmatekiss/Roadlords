<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roadlords – 50 vs 50 próbaharc</title><style>body{margin:0;padding:20px;background:#f2f0e9;font-family:system-ui,sans-serif}#rl-sword-trial{max-width:1400px;margin:auto}</style></head><body>
<div id="rl-sword-trial">
  <div class="rl-top">
    <div class="rl-army"><span class="rl-banner rl-blue" aria-hidden="true"></span><span>Kék kardosok <strong id="rl-blue-count">50</strong></span></div>
    <span id="rl-clock">00:00</span>
    <div class="rl-army"><span>Piros kardosok <strong id="rl-red-count">50</strong></span><span class="rl-banner rl-red" aria-hidden="true"></span></div>
  </div>
  <canvas id="rl-field" role="img" aria-label="Ötven kék és ötven piros, animált kardos csatája. A gyaloglás, kardcsapás, pajzsvédekezés és elesés külön mozdulat."></canvas>
  <div class="rl-controls">
    <button id="rl-play" type="button">Csata indítása</button>
    <label>Tempó <select id="rl-speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option></select></label>
    <button id="rl-zoom" type="button" aria-pressed="false">Közelkép</button>
    <button id="rl-replay" type="button">Új ütközet</button>
    <span id="rl-state" role="status" aria-live="polite">50 vs. 50 · készenlét</span>
  </div>
</div>
<style>
#rl-sword-trial{color-scheme:light dark;color:light-dark(#292b25,#e2e4dc);font-family:inherit;--rl-surface:light-dark(#f2f0e9,#252a25);--rl-border:light-dark(#c9c9bd,#4c554a);--rl-ink:light-dark(#292b25,#e2e4dc)}
#rl-sword-trial .rl-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
#rl-sword-trial .rl-army{display:flex;align-items:center;gap:8px}
#rl-sword-trial strong{font-weight:500;font-variant-numeric:tabular-nums;margin-left:5px}
#rl-sword-trial #rl-clock{font-variant-numeric:tabular-nums;opacity:.7}
#rl-sword-trial .rl-banner{display:inline-block;width:12px;height:20px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
#rl-sword-trial .rl-blue{background:#408fe5}#rl-sword-trial .rl-red{background:#d4564c}
#rl-sword-trial canvas{display:block;width:100%;aspect-ratio:12/7;border-radius:8px;background:#344236;touch-action:pan-y}
#rl-sword-trial .rl-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#rl-sword-trial .rl-controls label{display:flex;align-items:center;gap:7px}
#rl-sword-trial button,#rl-sword-trial select{font:inherit;color:var(--rl-ink);background:var(--rl-surface);border:1px solid var(--rl-border);padding:8px 11px;border-radius:6px;min-height:40px}
#rl-sword-trial button{cursor:pointer}#rl-sword-trial button:hover{filter:brightness(1.1)}
#rl-sword-trial #rl-play{background:light-dark(#344331,#b5c5a4);color:light-dark(#f4f1e9,#1e271d);border-color:transparent}
#rl-sword-trial button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px currentColor}
#rl-sword-trial #rl-state{flex:1 1 180px;opacity:.75}
@media(max-width:460px){#rl-sword-trial .rl-top{gap:5px}#rl-sword-trial .rl-army{gap:5px}#rl-sword-trial .rl-controls{gap:7px}#rl-sword-trial button,#rl-sword-trial select{min-height:44px}#rl-sword-trial canvas{aspect-ratio:1.35}}
</style>
<script>
(()=>{
 'use strict';
 const root=document.getElementById('rl-sword-trial');
 const el=id=>root.querySelector('#'+id),canvas=el('rl-field'),ctx=canvas.getContext('2d');
 const W=1200,H=700,TAU=Math.PI*2,STEP=1/60;
 const teams=[{main:'#4e91c4',dark:'#244c78',light:'#9accec',shield:'#337fb9'}, {main:'#bb5048',dark:'#70352f',light:'#f3afa0',shield:'#a64038'}];
 let seed=8317,units=[],sparks=[],dust=[],time=0,running=false,ended=false,speed=1,zoom=1,zoomGoal=1,acc=0,last=0,lastUI=-1,round=0,hits=0;
 let viewW=736,viewH=430,ground=null,camX=600,camY=350;
 function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const lerp=(a,b,t)=>a+(b-a)*t;
 function poly(g,points,fill,stroke='#292a23',width=1.4){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
 function ellipse(g,x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=color;g.fill()}
 function line(g,x,y,x2,y2,color,width=1){g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.stroke()}
 function makeGround(){
  const gcan=document.createElement('canvas');gcan.width=W;gcan.height=H;const g=gcan.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#273b32');grad.addColorStop(.5,'#45513a');grad.addColorStop(1,'#263b32');g.fillStyle=grad;g.fillRect(0,0,W,H);
  const saved=seed;seed=32121;
  for(let i=0;i<1600;i++){const x=rand()*W,y=rand()*H;ellipse(g,x,y,3+rand()*10,1+rand()*3,['#3c513b','#586146','#253b31','#6a704b'][i%4])}
  g.beginPath();g.moveTo(-10,154);g.bezierCurveTo(300,119,890,140,1210,166);g.lineTo(1210,555);g.bezierCurveTo(900,588,330,554,-10,568);g.closePath();const road=g.createLinearGradient(0,120,0,590);road.addColorStop(0,'#756449');road.addColorStop(.5,'#a18b63');road.addColorStop(1,'#726348');g.fillStyle=road;g.fill();
  for(let i=0;i<2900;i++){const x=rand()*W,y=156+rand()*402;g.globalAlpha=.13+rand()*.2;ellipse(g,x,y,rand()*7+1,rand()*2+.5,i%2?'#dac293':'#493d30')}g.globalAlpha=1;
  for(let y of [210,510]){line(g,0,y,W,y+Math.sin(y)*12,'#8c7855',2);line(g,0,y+12,W,y+15,'#aa936a',1)}
  for(let i=0;i<95;i++){const x=rand()*W,y=rand()<.5?70+rand()*67:590+rand()*85;const s=2+rand()*6;ellipse(g,x+3,y+4,s+3,s*.7,'#23332b');poly(g,[[x-s,y],[x-2,y-s*.6],[x+s,y-s*.2],[x+s*.7,y+s*.4],[x-s*.7,y+s*.5]],'#727868','#3c463b',1)}
  for(let side of [0,1])for(let i=0;i<9;i++){const x=45+i*139,y=side?603:102;line(g,x-15,y+11,x+20,y+8,'#332d22',5);line(g,x,y+17,x-2,y-10,'#746344',5);line(g,x-2,y-10,x-2,y-14,'#b19a69',2)}
  seed=saved;ground=gcan;
 }
 function flag(x,y,team){const c=teams[team];ctx.save();ctx.translate(x,y);ellipse(ctx,6,5,23,6,'#28312588');line(ctx,0,3,0,-63,'#463d2b',4);line(ctx,-1,-61,-1,-3,'#b49b69',1);poly(ctx,[[-4,-64],[0,-73],[4,-64]],'#c3b994');let wave=Math.sin(time*2+x)*3;poly(ctx,[[0,-59],[30,-56+wave],[29,-24+wave],[15,-32],[0,-31]],c.dark,'#292b28',1);poly(ctx,[[1,-58],[26,-56+wave],[25,-32],[16,-36],[1,-35]],c.main,null);line(ctx,12,-51,12,-39,'#ddd4aa',2);line(ctx,8,-47,16,-47,'#ddd4aa',2);ctx.restore()}
 function reset(){
  round++;seed=8317+round*97;units=[];sparks=[];dust=[];time=0;hits=0;acc=0;running=false;ended=false;lastUI=-1;
  for(let team=0;team<2;team++)for(let row=0;row<10;row++)for(let col=0;col<5;col++){
   units.push({id:units.length,team,x:team?830+col*36:370-col*36,y:180+row*36+(col%2)*3,vx:0,vy:0,face:team?-1:1,hp:100,maxhp:100,phase:rand()*TAU,walk:0,state:'idle',target:null,retarget:rand()*.2,cooldown:rand()*.65,atk:0,struck:false,hurt:0,guard:0,deadAt:0,age:0,speed:55+rand()*8,lean:0,personal:rand()-.5});
  }
  el('rl-play').textContent='Csata indítása';el('rl-state').textContent='50 vs. 50 · készenlét';updateUI();draw();
 }
 function nearest(u){let best=null,bestD=Infinity;for(const v of units){if(v.team===u.team||v.hp<=0)continue;const dx=v.x-u.x,dy=v.y-u.y,d=dx*dx+dy*dy*1.12;if(d<bestD){bestD=d;best=v}}return best}
 function impact(u,v,blocked){
  const x=(u.x+v.x)*.5,y=(u.y+v.y)*.5-13;
  for(let j=0;j<(blocked?5:3);j++)sparks.push({x,y,vx:(rand()-.5)*90,vy:-18-rand()*65,life:.18+rand()*.16,max:.34,color:blocked?'#f0db92':'#f4ede0'});
  if(sparks.length>180)sparks.splice(0,sparks.length-180);
 }
 function step(dt){
  if(ended)return;
  time+=dt;const pending=[];
  for(const u of units){
   u.age+=dt;if(u.hp<=0)continue;u.hurt=Math.max(0,u.hurt-dt);u.guard=Math.max(0,u.guard-dt);u.cooldown-=dt;u.retarget-=dt;
   if(!u.target||u.target.hp<=0||u.retarget<=0&&u.state!=='attack'){u.target=nearest(u);u.retarget=.25+rand()*.15}
   const v=u.target;if(!v){u.vx=u.vy=0;u.state='idle';continue}
   const dx=v.x-u.x,dy=v.y-u.y,d=Math.hypot(dx,dy)||1;
   if(Math.abs(dx)>3)u.face=dx>0?1:-1;
   if(u.state==='attack'){
    u.atk+=dt;u.vx=u.vy=0;
    if(!u.struck&&u.atk>=.27){u.struck=true;if(v.hp>0&&d<49){const blocked=rand()<.23;pending.push({u,v,damage:blocked?4:12+Math.floor(rand()*5),blocked});}}
    if(u.atk>=.72){u.state='idle';u.cooldown=.15+rand()*.25}
   }else if(d<38){u.vx=u.vy=0;u.state='idle';if(u.cooldown<=0){u.state='attack';u.atk=0;u.struck=false}}
   else{
    u.state='walk';const approach=Math.min(1,(d-31)/24);u.vx=dx/d*u.speed*approach;u.vy=dy/d*u.speed*approach;
    // A small lateral preference lets rear ranks flow around occupied allies.
    for(const a of units){if(a===u||a.hp<=0||a.team!==u.team)continue;const ax=u.x-a.x,ay=u.y-a.y,ad=Math.hypot(ax,ay);if(ad>0&&ad<32){const f=(32-ad)/32;u.vx+=ax/ad*f*32;u.vy+=ay/ad*f*32}}
    const mag=Math.hypot(u.vx,u.vy);if(mag>u.speed){u.vx*=u.speed/mag;u.vy*=u.speed/mag}
    u.x+=u.vx*dt;u.y+=u.vy*dt;u.walk+=Math.hypot(u.vx,u.vy)*dt*.16;
    if(rand()<dt*1.8&&dust.length<90)dust.push({x:u.x,y:u.y+2,r:1,life:.5,max:.5});
   }
   u.x=clamp(u.x,55,W-55);u.y=clamp(u.y,165,555);
  }
  for(let pass=0;pass<3;pass++)for(let i=0;i<units.length;i++){const a=units[i];if(a.hp<=0)continue;for(let j=i+1;j<units.length;j++){const b=units[j];if(b.hp<=0)continue;let dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx/28,dy/36);if(d>=1)continue;if(d<.001){dx=.1;dy=.1;d=Math.hypot(dx/28,dy/36)}const am=a.state==='attack'?.12:1,bm=b.state==='attack'?.12:1,k=1/d-1;a.x-=dx*k*am/(am+bm);a.y-=dy*k*am/(am+bm);b.x+=dx*k*bm/(am+bm);b.y+=dy*k*bm/(am+bm);}}
  // Resolve strikes together, so iteration order gives neither army a free first hit.
  for(const p of pending){if(p.v.hp<=0)continue;p.v.hp=Math.max(0,p.v.hp-p.damage);p.v.hurt=.17;p.v.guard=p.blocked?.22:0;hits++;impact(p.u,p.v,p.blocked);if(p.v.hp===0){p.v.state='dead';p.v.deadAt=time;p.v.vx=p.v.vy=0}}
  for(const p of sparks){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt}sparks=sparks.filter(p=>p.life>0);
  for(const p of dust){p.life-=dt;p.r+=dt*5}dust=dust.filter(p=>p.life>0);
  if(!units.some(u=>u.hp>0&&u.team===0)||!units.some(u=>u.hp>0&&u.team===1)){ended=true;running=false;el('rl-play').textContent='Új csata indítása';const blue=units.some(u=>u.hp>0&&u.team===0),red=units.some(u=>u.hp>0&&u.team===1);el('rl-state').textContent=blue?'A kék sereg győzött':red?'A piros sereg győzött':'Döntetlen';updateUI()}
 }
 function sword(g,x,y,angle){g.save();g.translate(x,y);g.rotate(angle);poly(g,[[0,-1.8],[21,-1.4],[27,0],[21,1.4],[0,1.8]],'#d9ded8','#3e4847',.8);line(g,2,-.5,23,-.4,'#f5f5df',.8);line(g,0,-5,0,5,'#c1a56c',2);line(g,-6,0,-1,0,'#614e36',2.7);ellipse(g,-7,0,1.6,1.6,'#bba276');g.restore()}
 function soldier(u){
  const team=teams[u.team],dead=u.hp<=0,deathAge=time-u.deadAt;
  if(dead&&deathAge>8)return;
  ctx.save();ctx.translate(u.x,u.y);if(dead){ctx.globalAlpha=.6*clamp(1-(deathAge-3)/5,0,1);ctx.rotate(u.face*clamp(deathAge/.5,0,1)*1.25);ctx.scale(1,.65)}
  ellipse(ctx,0,1,12,4,'#22291f55');ctx.scale(u.face,1);
  let attack=u.state==='attack',p=u.atk,wind=attack?clamp(p/.23,0,1):0;
  let strike=attack?clamp((p-.23)/.12,0,1):0,recovery=attack?clamp((p-.4)/.32,0,1):0;
  const walk=u.state==='walk'?Math.sin(u.walk+u.phase):0;
  const bob=u.state==='walk'?Math.abs(Math.sin(u.walk+u.phase))*.9:0;
  const thrust=attack?(strike*5-wind*1.5)*(1-recovery):0;
  const flinch=u.hurt>0?-Math.sin(u.hurt/.17*Math.PI)*2:0;
  // Feet remain grounded while the hips, torso, shield and sword move independently.
  line(ctx,-3,-9,-4-walk*3.5,-1,'#353c38',4);line(ctx,3,-9,4+walk*3.5,0,'#56605a',4);
  ellipse(ctx,-3-walk*3.5,0,4,2.3,'#3f3024');ellipse(ctx,5+walk*3.5,1,4.2,2.4,'#49392a');
  ctx.translate(thrust+flinch,-bob);
  // Back arm and shoulder.
  line(ctx,-3,-23,-8,-14,team.dark,5);
  poly(ctx,[[-6,-22],[4,-23],[7,-10],[4,-5],[-6,-6],[-8,-11]],team.dark);
  poly(ctx,[[-5,-23],[4,-23],[5,-10],[-4,-10]],team.main);
  line(ctx,-5,-10,5,-10,'#49382b',2.4);ellipse(ctx,1,-10,1.4,1.6,'#bca16b');
  line(ctx,-2,-20,-1,-13,team.light,.7);line(ctx,2,-21,3,-14,team.dark,1);
  for(let k=0;k<3;k++)line(ctx,-5+k*3,-8,-5+k*3,-5,'#85908a',1);
  ellipse(ctx,-4,-23,4.2,3,'#9da69e');ellipse(ctx,5,-22,4,3,'#a9b2a7');
  // Helmet and dark visor: the face remains deliberately simple at game scale.
  ellipse(ctx,1,-28,6.4,5.8,'#333d3a');poly(ctx,[[-5,-29],[-3,-34],[3,-35],[7,-30],[6,-24],[-4,-24]],'#abb5ac','#3b4542',1);
  poly(ctx,[[-3,-33],[1,-34],[2,-28],[-4,-28]],'#d1d8c9',null);line(ctx,3,-34,4,-27,'#6f7b74',1);
  line(ctx,1,-27,7,-27,'#29312e',2);line(ctx,7,-27,7,-23,'#677570',1.5);
  poly(ctx,[[-2,-35],[-2,-39],[3,-38],[4,-34]],team.main,'#30372f',.7);
  // Shield lifts briefly when a strike is blocked.
  ctx.save();ctx.translate(-7+(u.guard?2:0),-17-(u.guard?3:0));ctx.rotate(-.16+(u.guard?-.3:0));
  poly(ctx,[[-5,-7],[4,-8],[6,0],[2,9],[-3,7],[-6,0]],'#b9a77b','#303a34',1.2);
  poly(ctx,[[-3.5,-5.5],[2.5,-6],[4,0],[1.5,6],[-2,5],[-4,0]],team.shield,null);
  line(ctx,0,-5,1,5,'#d5c59c',1.5);line(ctx,-3,-1,3,-1,'#d5c59c',1.5);ellipse(ctx,0,-1,1.4,1.4,'#c3c8b5');ctx.restore();
  let angle=-.8,handX=9,handY=-18;
  if(attack){angle=lerp(-.8,-2.25,wind);angle=lerp(angle,.58,strike);angle=lerp(angle,-.8,recovery);handX=9+strike*3*(1-recovery);handY=-18-wind*5*(1-strike)}
  else if(u.state==='walk'){angle=-.65+walk*.1;handY+=walk*.8}
  line(ctx,5,-22,handX-2,handY-1,team.main,4);line(ctx,handX-2,handY-1,handX,handY,'#a3a99c',3);
  if(attack&&p>.24&&p<.36){ctx.save();ctx.globalAlpha=.28;ctx.strokeStyle='#f7e5ab';ctx.lineWidth=2.3;ctx.beginPath();ctx.arc(handX,handY,22,angle-.7,angle);ctx.stroke();ctx.restore()}
  sword(ctx,handX,handY,angle);ellipse(ctx,handX-3,handY,1.8,1.8,'#b3a78c');
  ctx.restore();
  if(!dead&&u.hurt>0){ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#242d25';ctx.fillRect(u.x-11,u.y-48,22,3);ctx.fillStyle=team.light;ctx.fillRect(u.x-11,u.y-48,22*u.hp/u.maxhp,3);ctx.restore()}
 }
 function draw(){
  const dpr=Math.min(window.devicePixelRatio||1,2);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,viewW,viewH);
  const scale=Math.max(viewW/W,viewH/H)*zoom;
  ctx.save();ctx.translate(viewW/2,viewH/2);ctx.scale(scale,scale);ctx.translate(-camX,-camY);
  ctx.drawImage(ground,0,0);flag(115,137,0);flag(1085,137,1);flag(115,595,0);flag(1085,595,1);
  for(const p of dust){ctx.globalAlpha=p.life/p.max*.22;ellipse(ctx,p.x,p.y,p.r*2,p.r,'#dbc398')}ctx.globalAlpha=1;
  for(const u of units.filter(u=>u.hp<=0).sort((a,b)=>a.y-b.y))soldier(u);
  for(const u of units.filter(u=>u.hp>0).sort((a,b)=>a.y-b.y))soldier(u);
  for(const p of sparks){ctx.globalAlpha=p.life/p.max;line(ctx,p.x,p.y,p.x-p.vx*.028,p.y-p.vy*.028,p.color,1.6)}ctx.globalAlpha=1;
  ctx.restore();
 }
 function updateUI(){el('rl-blue-count').textContent=units.filter(u=>u.team===0&&u.hp>0).length;el('rl-red-count').textContent=units.filter(u=>u.team===1&&u.hp>0).length;el('rl-clock').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0');}
 function resize(){const box=canvas.getBoundingClientRect();viewW=Math.max(1,box.width);viewH=Math.max(1,box.height);const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);draw()}
 function frame(now){const dt=Math.min(.08,(now-last)/1000||0);last=now;if(running){acc+=dt*speed;let n=0;while(acc>=STEP&&n++<12){step(STEP);acc-=STEP;if(!running)break}}zoom=lerp(zoom,zoomGoal,Math.min(1,dt*9));
  if(zoom>1.1){const alive=units.filter(u=>u.hp>0);let x=alive.length?alive.reduce((s,u)=>s+u.x,0)/alive.length:600;camX=lerp(camX,clamp(x,340,860),dt*2)}else camX=lerp(camX,600,dt*3);
  if(time-lastUI>.2){updateUI();lastUI=time}draw();requestAnimationFrame(frame);
 }
 el('rl-play').addEventListener('click',()=>{if(ended)reset();running=!running;acc=0;el('rl-play').textContent=running?'Szünet':'Folytatás';el('rl-state').textContent=running?'Ütközet folyamatban':'Szüneteltetve'});
 el('rl-replay').addEventListener('click',reset);
 el('rl-speed').addEventListener('change',e=>{speed=Number(e.target.value);acc=0});
 el('rl-zoom').addEventListener('click',()=>{zoomGoal=zoomGoal===1?2.3:1;el('rl-zoom').setAttribute('aria-pressed',String(zoomGoal>1));el('rl-zoom').textContent=zoomGoal>1?'Teljes pálya':'Közelkép'});
 makeGround();reset();new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(frame);
 // Deterministic inspection hooks are local to this isolated demo.
 root.battle={step,draw,reset,getUnits:()=>units,getState:()=>({time,hits,ended,running,speed,zoomGoal}),setZoom:v=>{zoom=zoomGoal=v;draw()}};
})();
</script>
</body></html>
